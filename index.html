<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ScratchBlox 2007</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="topbar"><b>ScratchBlox</b><span>2007 classic building mode</span></div>
  <main>
    <section id="game-panel">
      <canvas id="game" width="900" height="540"></canvas>
      <div id="help">WASD / arrows: move &nbsp; Space: jump &nbsp; Click: build &nbsp; Right-click: delete &nbsp; R: reset</div>
    </section>
    <aside>
      <h2>Build Tools</h2>
      <p>Choose a brick, then click the world to place it.</p>
      <div id="palette"></div>
      <button id="reset">Reset World</button>
      <h3>About</h3>
      <p>ScratchBlox is an original, fan-made 2007-inspired sandbox prototype. It is not affiliated with Roblox.</p>
    </aside>
  </main>
  <script src="game.js"></script>
</body>
</html>
